# CI for the App artifact and the device's own fixtures (k7-deploy.md §6).
#
#   web    the App: typecheck, unit tests, build, A9 manifest shape, D14 artifact guard
#   host   the device's portable C, on the host build (host/Makefile `check`)
#   e2e    documented but commented: it needs a Playwright dependency that does not exist yet
#
# The firmware build is deliberately not here: it needs ESP-IDF, and CI proves the artifact,
# not the flash (k7-deploy D16).
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (HTTPS artifact)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # A9: Chrome's install criteria, checked against the artifact that was just built, so
      # a manifest regression fails here instead of in a broken install on the real origin.
      - name: Manifest shape (A9)
        run: node scripts/check-manifest.mjs
      # D14's second guard: no development origin and no pre-rename host anywhere in dist.
      - name: Artifact origins (D14)
        run: node scripts/check-artifact.mjs

  host:
    name: host (portable C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The target the repo already has: unit tests, the layering check (H3), and the HTTP
      # acceptance tests, including /app mapping and both Snapshot magics. The k7.db →
      # xtape.db fallback lives in board_esp32.c, which needs a card and a board: it is
      # proven on hardware, not here.
      - name: make -C host check
        run: make -C host check

  # e2e: activates when the Playwright suite lands — one status round trip from the hosted
  # App to `http://k7.local` once the Local Network Access permission is granted. The App is
  # served at http://localhost:<port> so no certificate is needed. No Playwright dependency
  # exists in web/package.json yet, so this job stays commented rather than red.
  #
  # e2e:
  #   name: e2e (two origins)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: npm
  #         cache-dependency-path: web/package-lock.json
  #     - name: Install
  #       working-directory: web
  #       run: npm ci
  #     - name: Install Chromium
  #       working-directory: web
  #       run: npx playwright install --with-deps chromium
  #     - name: Two-origin suite
  #       working-directory: web
  #       run: npx playwright test
