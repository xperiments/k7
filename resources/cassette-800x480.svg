      <line x1="552" y1="155" x2="548" y2="151" stroke="#C0481B" stroke-width="4" stroke-linecap="round"/>
      <line x1="636" y1="257" x2="640" y2="261" stroke="#C0481B" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <g id="cassette-meter" transform="translate(546 158)">
    <rect x="0" y="47" width="96" height="1" fill="#7F2C18"/>
    <rect x="18" y="22" width="28" height="4" rx="2" fill="#F15A22"/>
    <rect x="18" y="70" width="28" height="4" rx="2" fill="#F15A22"/>
