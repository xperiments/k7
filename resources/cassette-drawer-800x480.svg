    cassette_buttons.c and cassette_style.c. Sample playing frame:
    position 350/1000 -> pack fills 678/402,
    pack diameters 308/260 px,
    hub frames 5/13 of 36, VU L/R 0.22/0.15.
    Pose: scale 160/256, offset (0, 0).
  -->
