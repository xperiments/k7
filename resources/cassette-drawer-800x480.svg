<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="drawer-title drawer-desc">
  <title id="drawer-title">xtape cassette screen - transport drawer open</title>
  <desc id="drawer-desc">The same cassette and playing frame at the 160/256 pose the transport drawer asks for, with the 120 px left-edge drawer open and its three line-art buttons P, R and W.</desc>
