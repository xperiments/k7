## Dependencies for the application layer.
##
## The server components (http_server, mini_icecast, mini_files) are in this
## repository and deliberately do not depend on any of these: the host build
## compiles them, and the host tier must stay free of anything that cannot run
## there. LVGL belongs to the application, not to the broadcast.
dependencies:
  idf: ">=5.4"

  ## The UI toolkit for the final product. v9 rather than v8: v8.4 reached
  ## end-of-life in March 2025.
  lvgl/lvgl: "^9.6.0"
