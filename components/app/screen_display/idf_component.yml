version: "1.0.0"
description: "The screen display: panel and touch bring-up, LVGL's PSRAM allocator and the cassette view."
license: "MIT"
targets:
  - esp32s3
dependencies:
  idf: ">=5.4"

  ## The UI toolkit. v9 rather than v8: v8.4 reached end-of-life in March 2025.
  lvgl/lvgl: "^9.6.0"

  ## The verified display integration, rather than this project's own hand-rolled one.
  ## A hand-written RGB path had the panel doubling and banding the picture while the
  ## reference project ran the same board correctly; the port owns the framebuffer and
  ## vsync handshake that is easy to get subtly wrong, and its `avoid_tearing` path
  ## gives LVGL the panel's own two buffers in direct mode.
  espressif/esp_lvgl_port: "^2"

  ## The panel board's touch controller. The GT911 driver is the one the reference
  ## project runs on this board, and `esp_lcd_touch` is the interface the screen
  ## display's touch adapter is written against. They are fetched for every build of
  ## this component; only the Sunton build compiles against them.
  espressif/esp_lcd_touch: "1.2.1"
  espressif/esp_lcd_touch_gt911: "1.2.1"
